<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebrox — AI Agent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🔥</div>
        <div class="brand-text">
          <h1>Firebrox</h1>
          <span>multi-tool AI agent</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="modelPill" class="pill" title="Current model — click to open settings">
          <span class="dot" id="modelDot"></span>
          <span id="modelLabel">Demo brain</span>
        </button>
        <button id="newChatBtn" class="icon-btn" title="New chat">＋</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Chat -->
    <main id="chat" class="chat">
      <div id="emptyState" class="empty">
        <div class="empty-flame">🔥</div>
        <h2>What can I help you build?</h2>
        <p class="muted">Firebrox searches the web, runs code, writes files, does math, and remembers — with any model you bring.</p>
        <div class="chips" id="chips">
          <button class="chip">Search the web for the latest AI news</button>
          <button class="chip">Calculate (128 + 512) * 3 / 4</button>
          <button class="chip">Run code: print the first 20 Fibonacci numbers</button>
          <button class="chip">Write a file poem.txt with a haiku about fire</button>
          <button class="chip">Remember my favorite color is blue, then recall it</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
    </main>

    <!-- Composer -->
    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Firebrox…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="sendBtn" class="send-btn" title="Send">➤</button>
        <button id="stopBtn" class="stop-btn hidden" title="Stop">■</button>
      </div>
      <div class="composer-hint" id="composerHint">Demo brain active — add a model key in Settings for full reasoning.</div>
    </footer>
  </div>

  <!-- Settings modal -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>Settings</h3>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Provider</span>
          <select id="providerSelect"></select>
        </label>
        <label class="field">
          <span>API key <small id="keyStatus"></small></span>
          <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" />
        </label>
        <label class="field">
          <span>Model</span>
          <input id="model" type="text" placeholder="e.g. gpt-4o-mini" list="modelList" />
          <datalist id="modelList"></datalist>
        </label>
        <label class="field">
          <span>Base URL <small>(optional)</small></span>
          <input id="baseURL" type="text" placeholder="auto" />
        </label>
        <label class="field">
          <span>Temperature <small id="tempVal">0.7</small></span>
          <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7" />
        </label>
        <label class="field">
          <span>Max tool steps <small>(per message)</small></span>
          <input id="maxSteps" type="number" min="1" max="20" value="8" />
        </label>
        <label class="field">
          <span>System prompt <small>(optional override)</small></span>
          <textarea id="systemPrompt" rows="4" placeholder="Default Firebrox agent prompt"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <span id="saveStatus" class="muted"></span>
        <button id="saveSettings" class="primary-btn">Save settings</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
